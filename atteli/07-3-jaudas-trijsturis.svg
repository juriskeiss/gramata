<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" width="520" height="220" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<title>Jaudas trijstūris</title>
<rect x="0" y="0" width="520" height="220" fill="white"/>
<polygon points="130.0,30.0 30.0,190.0 230.0,190.0" fill="#fbebd3" stroke="#b45309" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="75.0" y1="118.0" x2="185.0" y2="118.0" stroke="#b45309" stroke-width="1.6" stroke-linecap="round"/>
<line x1="130.0" y1="118.0" x2="130.0" y2="190.0" stroke="#b45309" stroke-width="1.6" stroke-linecap="round"/>
<text x="130.0" y="96.0" text-anchor="middle" font-size="30" fill="#111111" font-weight="bold">P</text>
<text x="92.0" y="170.0" text-anchor="middle" font-size="30" fill="#111111" font-weight="bold">U</text>
<text x="168.0" y="170.0" text-anchor="middle" font-size="30" fill="#111111" font-weight="bold">I</text>
<text x="300.0" y="70.0" text-anchor="start" font-size="17" fill="#111111">P = U · I</text>
<text x="300.0" y="118.0" text-anchor="start" font-size="17" fill="#111111">U = P / I</text>
<text x="300.0" y="166.0" text-anchor="start" font-size="17" fill="#111111">I = P / U</text>
<text x="300.0" y="200.0" text-anchor="start" font-size="11" fill="#111111" font-style="italic">tāpat kā Oma likuma trijstūris</text>
</svg>
