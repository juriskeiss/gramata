<text x="210.0" y="166.8" text-anchor="middle" font-size="12" fill="#111111">SWR</text>
<text x="210.0" y="181.8" text-anchor="middle" font-size="12" fill="#111111">mērītājs</text>
<rect x="293.0" y="144.0" width="104.0" height="52.0" rx="4" fill="white" stroke="#111111" stroke-width="1.6"/>
<text x="345.0" y="166.8" text-anchor="middle" font-size="12" fill="#111111">Antenas</text>
<text x="345.0" y="181.8" text-anchor="middle" font-size="12" fill="#111111">skaņotājs</text>
<line x1="132.0" y1="170.0" x2="152.6" y2="170.0" stroke="#111111" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="158.0,170.0 149.8,173.7 149.8,166.3" fill="#111111" stroke="#111111" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="262.0" y1="170.0" x2="287.6" y2="170.0" stroke="#111111" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="293.0,170.0 284.8,173.7 284.8,166.3" fill="#111111" stroke="#111111" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="397.0" y1="170.0" x2="606.0" y2="170.0" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
<text x="501.5" y="158.0" text-anchor="middle" font-size="11" fill="#111111" font-style="italic">koaksiālais kabelis (nesimetrisks)</text>
<rect x="606.0" y="150.0" width="68.0" height="40.0" rx="4" fill="white" stroke="#111111" stroke-width="1.6"/>
<text x="640.0" y="167.1" text-anchor="middle" font-size="11" fill="#111111">Baluns</text>
<text x="640.0" y="180.8" text-anchor="middle" font-size="11" fill="#111111">1:1</text>
<line x1="640.0" y1="150.0" x2="640.0" y2="80.0" stroke="#111111" stroke-width="1.8" stroke-linecap="round"/>
<line x1="510.0" y1="80.0" x2="770.0" y2="80.0" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
<circle cx="640.0" cy="80.0" r="4.0" fill="#111111" stroke="#111111" stroke-width="1.6"/>
<text x="640.0" y="64.0" text-anchor="middle" font-size="11" fill="#111111" font-style="italic">dipols (simetrisks)</text>
<polyline points="28.0,216.0 28.0,224.0 397.0,224.0 397.0,216.0" fill="none" stroke="#2f7a4b" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="212.0" y="243.1" text-anchor="middle" font-size="11" fill="#2f7a4b">transīvers redz 50 Ω: SWR ≈ 1:1,</text>
<text x="212.0" y="256.8" text-anchor="middle" font-size="11" fill="#2f7a4b">raidītājs dod pilnu jaudu</text>
<polyline points="397.0,216.0 397.0,224.0 606.0,224.0 606.0,216.0" fill="none" stroke="#b45309" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="505.0" y="243.1" text-anchor="middle" font-size="11" fill="#b45309">stāvviļņi un zudumi kabelī paliek —</text>
<text x="505.0" y="256.8" text-anchor="middle" font-size="11" fill="#b45309">skaņotājs antenu nelabo</text>
<text x="730.0" y="165.1" text-anchor="middle" font-size="10" fill="#111111" font-style="italic">neļauj strāvai</text>
<text x="730.0" y="177.6" text-anchor="middle" font-size="10" fill="#111111" font-style="italic">plūst pa kabeļa</text>
<text x="730.0" y="190.1" text-anchor="middle" font-size="10" fill="#111111" font-style="italic">apvalka ārpusi</text>
