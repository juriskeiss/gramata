<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<title>SWR mērītāja, antenas skaņotāja un baluna vieta stacijā</title>
<rect x="0" y="0" width="800" height="300" fill="white"/>
<rect x="28.0" y="144.0" width="104.0" height="52.0" rx="4" fill="white" stroke="#111111" stroke-width="1.6"/>
<text x="80.0" y="174.3" text-anchor="middle" font-size="12" fill="#111111">Transīvers</text>
