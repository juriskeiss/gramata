<text x="505.2" y="198.0" text-anchor="middle" font-size="11" fill="#73281e" font-weight="bold">6 m</text>
<line x1="570.5" y1="120.0" x2="570.5" y2="206.0" stroke="#73281e" stroke-width="1.4" stroke-linecap="round"/>
