<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<title>Radiofrekvenču spektra dalījums un B kategorijas joslas</title>
<rect x="0" y="0" width="800" height="250" fill="white"/>
<rect x="40.0" y="70.0" width="144.0" height="50.0" rx="0" fill="#ececec" stroke="#111111" stroke-width="1.2"/>
<text x="112.0" y="92.0" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">LF</text>
<text x="112.0" y="110.0" text-anchor="middle" font-size="11" fill="#111111">garie viļņi</text>
<text x="112.0" y="60.0" text-anchor="middle" font-size="11" fill="#111111" font-weight="bold">30–300 kHz</text>
<text x="112.0" y="42.0" text-anchor="middle" font-size="11" fill="#555" font-style="italic">10–1 km</text>
<rect x="184.0" y="70.0" width="144.0" height="50.0" rx="0" fill="#e4e4e4" stroke="#111111" stroke-width="1.2"/>
<text x="256.0" y="92.0" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">MF</text>
<text x="256.0" y="110.0" text-anchor="middle" font-size="11" fill="#111111">vidējie viļņi</text>
<text x="256.0" y="60.0" text-anchor="middle" font-size="11" fill="#111111" font-weight="bold">300–3000 kHz</text>
<text x="256.0" y="42.0" text-anchor="middle" font-size="11" fill="#555" font-style="italic">1000–100 m</text>
<rect x="328.0" y="70.0" width="144.0" height="50.0" rx="0" fill="#fbebd3" stroke="#111111" stroke-width="1.2"/>
