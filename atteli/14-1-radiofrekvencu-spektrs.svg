<text x="400.0" y="60.0" text-anchor="middle" font-size="11" fill="#111111" font-weight="bold">3–30 MHz</text>
<text x="400.0" y="42.0" text-anchor="middle" font-size="11" fill="#555" font-style="italic">100–10 m</text>
<rect x="472.0" y="70.0" width="144.0" height="50.0" rx="0" fill="#dde8f6" stroke="#111111" stroke-width="1.2"/>
<text x="544.0" y="92.0" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">VHF</text>
<text x="544.0" y="110.0" text-anchor="middle" font-size="11" fill="#111111">metru viļņi</text>
<text x="544.0" y="60.0" text-anchor="middle" font-size="11" fill="#111111" font-weight="bold">30–300 MHz</text>
<text x="544.0" y="42.0" text-anchor="middle" font-size="11" fill="#555" font-style="italic">10–1 m</text>
<rect x="616.0" y="70.0" width="144.0" height="50.0" rx="0" fill="#dcefe2" stroke="#111111" stroke-width="1.2"/>
<text x="688.0" y="92.0" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">UHF</text>
<text x="688.0" y="110.0" text-anchor="middle" font-size="11" fill="#111111">decimetru viļņi</text>
<text x="688.0" y="60.0" text-anchor="middle" font-size="11" fill="#111111" font-weight="bold">300–3000 MHz</text>
<text x="688.0" y="42.0" text-anchor="middle" font-size="11" fill="#555" font-style="italic">1 m – 10 cm</text>
<text x="40.0" y="22.0" text-anchor="start" font-size="11" fill="#555" font-style="italic">viļņa garums (slīprakstā) un frekvence</text>
<text x="760.0" y="24.0" text-anchor="end" font-size="11" fill="#111111" font-style="italic">frekvence aug →</text>
<text x="40.0" y="170.0" text-anchor="start" font-size="12" fill="#73281e" font-weight="bold">B kategorijas joslas:</text>
