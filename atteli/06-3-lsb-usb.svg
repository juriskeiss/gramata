<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" width="780" height="250" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<title>LSB un USB signāls pret noskaņoto frekvenci</title>
<rect x="0" y="0" width="780" height="250" fill="white"/>
<text x="200.0" y="24.0" text-anchor="middle" font-size="14" fill="#1e5aa8" font-weight="bold">LSB — apakšējā sānjosla</text>
<text x="200.0" y="42.0" text-anchor="middle" font-size="11" fill="#111111" font-style="italic">zem 10 MHz: 80 m, 40 m</text>
<line x1="40.0" y1="170.0" x2="354.6" y2="170.0" stroke="#111111" stroke-width="1.3" stroke-linecap="round"/>
<polygon points="360.0,170.0 351.8,173.7 351.8,166.3" fill="#111111" stroke="#111111" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="360.0" y="188.0" text-anchor="end" font-size="13" fill="#111111" font-style="italic">f</text>
<polygon points="192.0,170.0 192.0,98.0 100.0,136.0 100.0,170.0" fill="#dde8f6" stroke="#1e5aa8" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="200.0" y1="174.0" x2="200.0" y2="66.0" stroke="#111111" stroke-width="1.4" stroke-dasharray="5 4" stroke-linecap="round"/>
<text x="200.0" y="60.0" text-anchor="middle" font-size="11" fill="#111111">noskaņotā frekvence</text>
<line x1="100.0" y1="196.0" x2="195.8" y2="196.0" stroke="#111111" stroke-width="1.2" stroke-linecap="round"/>
<polygon points="200.0,196.0 193.6,198.9 193.6,193.1" fill="#111111" stroke="#111111" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="200.0" y1="196.0" x2="104.2" y2="196.0" stroke="#111111" stroke-width="1.2" stroke-linecap="round"/>
<polygon points="100.0,196.0 106.4,193.1 106.4,198.9" fill="#111111" stroke="#111111" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="150.0" y="214.0" text-anchor="middle" font-size="12" fill="#111111">≈ 3 kHz</text>
<text x="580.0" y="24.0" text-anchor="middle" font-size="14" fill="#b45309" font-weight="bold">USB — augšējā sānjosla</text>
<text x="580.0" y="42.0" text-anchor="middle" font-size="11" fill="#111111" font-style="italic">virs 10 MHz: 15 m, 10 m, 2 m, 70 cm</text>
<line x1="420.0" y1="170.0" x2="734.6" y2="170.0" stroke="#111111" stroke-width="1.3" stroke-linecap="round"/>
<polygon points="740.0,170.0 731.8,173.7 731.8,166.3" fill="#111111" stroke="#111111" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="740.0" y="188.0" text-anchor="end" font-size="13" fill="#111111" font-style="italic">f</text>
<polygon points="588.0,170.0 588.0,98.0 680.0,136.0 680.0,170.0" fill="#fbebd3" stroke="#b45309" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="580.0" y1="174.0" x2="580.0" y2="66.0" stroke="#111111" stroke-width="1.4" stroke-dasharray="5 4" stroke-linecap="round"/>
<text x="580.0" y="60.0" text-anchor="middle" font-size="11" fill="#111111">noskaņotā frekvence</text>
<line x1="580.0" y1="196.0" x2="675.8" y2="196.0" stroke="#111111" stroke-width="1.2" stroke-linecap="round"/>
<polygon points="680.0,196.0 673.6,198.9 673.6,193.1" fill="#111111" stroke="#111111" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="680.0" y1="196.0" x2="584.2" y2="196.0" stroke="#111111" stroke-width="1.2" stroke-linecap="round"/>
<polygon points="580.0,196.0 586.4,193.1 586.4,198.9" fill="#111111" stroke="#111111" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="630.0" y="214.0" text-anchor="middle" font-size="12" fill="#111111">≈ 3 kHz</text>
<line x1="390.0" y1="30.0" x2="390.0" y2="230.0" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="3 5" stroke-linecap="round"/>
</svg>
